<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Expediente</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { position: fixed; inset: 0; }
    #scene { position: absolute; inset: 0; background: #000; display: grid; place-items: center; }
    #evidence { width: 100%; height: 100%; object-fit: contain; display: block; opacity: 1; }
    #evidence.hidden { visibility: hidden; }
    #start { position: fixed; inset: 0; display: grid; place-items: end center; padding: 28px 16px calc(28px + env(safe-area-inset-bottom)); color: rgba(255,255,255,.55); font: 10px/1.4 monospace; letter-spacing: .22em; text-align: center; background: transparent; border: 0; cursor: pointer; text-transform: uppercase; }
    #start.gone { display: none; }
    #secret { position: fixed; right: 0; bottom: 0; width: 9%; height: 8%; min-width: 28px; min-height: 28px; border: 0; background: transparent; opacity: 0; z-index: 3; cursor: pointer; }
    #secret.off { display: none; }
  </style>
</head>
<body>
  <main id="scene" aria-label="Expediente clasificado">
    <img id="evidence" src="assets/image.jpg" alt="Imagen de evidencia">
  </main>
  <audio id="soundtrack" src="assets/music.mp3" preload="auto"></audio>
  <button id="start" type="button">Toca para iniciar el expediente</button>
  <a id="secret" href="https://youtu.be/EPgrb25QC38?si=zntLkqgNfcam7Es-" target="_blank" rel="noopener noreferrer" aria-label="Abrir contenido relacionado"></a>
  <script>
    (() => {
      const audio = document.getElementById('soundtrack');
      const image = document.getElementById('evidence');
      const start = document.getElementById('start');
      const secret = document.getElementById('secret');
      let started = false;
      let transitionDone = false;
      let black = false;

      function begin() {
        if (started) return;
        started = true;
        start.classList.add('gone');
        audio.currentTime = 0;
        audio.play().then(() => {
          // The 73-second countdown starts when playback actually begins.
          window.setTimeout(() => {
            black = true;
            image.classList.add('hidden');
            secret.classList.add('off');
          }, 73000);
        }).catch(() => {
          started = false;
          start.classList.remove('gone');
        });
      }

      start.addEventListener('click', begin);
      // First interaction anywhere can start audio without adding visible controls.
      document.addEventListener('pointerdown', (event) => {
        if (!started && event.target !== secret) begin();
      }, { once: true });

      audio.addEventListener('ended', () => {
        if (black && !transitionDone) {
          transitionDone = true;
          image.src = 'assets/image-close.jpg';
          image.classList.remove('hidden');
          secret.classList.remove('off');
        }
        audio.currentTime = 0;
        audio.play().catch(() => {});
      });
    })();
  </script>
</body>
</html>
